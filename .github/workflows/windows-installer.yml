name: windows-installer

on:
  push:
    branches: [main]
    paths: ["datas/**", "installer/windows/**", "installer/datas.spec", "pyproject.toml", ".github/workflows/windows-installer.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write       # attach the installer to a release when run on a v* tag
  id-token: write       # sign a statement of where the file was built (provenance)
  attestations: write

jobs:
  setup-exe:
    runs-on: windows-latest
    env:
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install package + pyinstaller
        run: |
          python -m pip install --upgrade pip
          pip install ".[nvidia,voice]" pyinstaller
      - name: version
        id: v
        shell: bash
        run: echo "version=$(python -c 'import datas;print(datas.__version__)')" >> "$GITHUB_OUTPUT"
      - name: the starter AI, shipped inside (checked against its SHA-256)
        run: python scripts/fetch_starter.py
      - name: pyinstaller
        run: pyinstaller --noconfirm installer/datas.spec
      - name: smoke test the frozen app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($args in @(@('--version'), @('selftest'), @('scan'), @('recommend','--context','4096'), @('catalog','list'), @('voice','status'), @('images','status'), @('apps','list'), @('voice','say','Datas can talk.','--out','say.wav'))) {
            & dist\Datas\datas-cli.exe @args
            if ($LASTEXITCODE -ne 0) { throw "datas-cli.exe $args failed with exit code $LASTEXITCODE" }
          }
      - name: open the real window (WebView2) and let it check itself
        shell: pwsh
        timeout-minutes: 8
        run: |
          $env:DATAS_HOME = "$env:RUNNER_TEMP\datas-window"
          $out = "$env:RUNNER_TEMP\window.json"
          $p = Start-Process -FilePath dist\Datas\Datas.exe -ArgumentList 'open','--selfcheck',$out -Wait -PassThru
          if (Test-Path $out) { Get-Content $out }
          if ($p.ExitCode -ne 0) {
            if (Test-Path "$env:DATAS_HOME\logs\datas.log") { Get-Content "$env:DATAS_HOME\logs\datas.log" -Tail 60 }
            throw "the window self-check failed (exit code $($p.ExitCode))"
          }
      - name: start with Windows (the person's Run list), no window; status; remove
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DATAS_HOME = "$env:RUNNER_TEMP\datas-service"
          & dist\Datas\datas-cli.exe service install
          if ($LASTEXITCODE -ne 0) { throw "service install failed" }
          $line = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run').Datas
          Write-Output "Run entry: $line"
          if ($line -notmatch 'Datas\.exe"? serve --no-browser --home') { throw "unexpected Run entry" }
          $ok = $false
          foreach ($i in 1..60) { try { Invoke-RestMethod http://127.0.0.1:8420/api/status | Out-Null; $ok = $true; break } catch { Start-Sleep 1 } }
          if (-not $ok) { throw "the background Datas does not answer" }
          & dist\Datas\datas-cli.exe service status
          & dist\Datas\datas-cli.exe link code
          & dist\Datas\datas-cli.exe service remove
          Start-Sleep 3
          if ((Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run').Datas) { throw "Run entry left behind" }
          try { Invoke-RestMethod http://127.0.0.1:8420/api/status | Out-Null; throw "still running after remove" } catch { if ($_.Exception.Message -eq "still running after remove") { throw } }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-check-windows
          path: |
            ${{ runner.temp }}/window.json
            ${{ runner.temp }}/window.png
          if-no-files-found: ignore
      # --- Windows signing: only when the owner added a certificate (docs/SIGNING.md) ---
      - name: sign the programs (only if a certificate was provided)
        if: env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          PFX: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\sign.pfx", [Convert]::FromBase64String($env:PFX))
          $tool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $tool sign /f "$env:RUNNER_TEMP\sign.pfx" /p $env:PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist\Datas\Datas.exe dist\Datas\datas-cli.exe
          if ($LASTEXITCODE -ne 0) { throw "signing failed" }
      - name: inno setup
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.v.outputs.version }} installer\windows\datas.iss
      - name: sign the installer (only if a certificate was provided)
        if: env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $tool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $tool sign /f "$env:RUNNER_TEMP\sign.pfx" /p $env:PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 (Get-ChildItem dist\Datas-Setup-*.exe).FullName
          if ($LASTEXITCODE -ne 0) { throw "signing failed" }
          Remove-Item "$env:RUNNER_TEMP\sign.pfx"
      - uses: actions/upload-artifact@v4
        with:
          name: Datas-Setup-windows
          path: dist/Datas-Setup-*.exe
      - name: checksum file (SHA-256) next to the installer
        shell: bash
        run: cd dist && for f in Datas-Setup-*.exe; do sha256sum "$f" > "$f.sha256"; cat "$f.sha256"; done
      - name: attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Datas-Setup-*.exe
            dist/Datas-Setup-*.exe.sha256
      - name: signed provenance — a public, verifiable record that this file was built here from this commit
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true   # never blocks a release; see docs/SIGNING.md
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/Datas-Setup-*.exe
