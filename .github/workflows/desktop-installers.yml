name: desktop-installers

on:
  push:
    branches: [main]
    paths: ["datas/**", "installer/**", "pyproject.toml", ".github/workflows/desktop-installers.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write       # attach the installers to a release when run on a v* tag
  id-token: write       # sign a statement of where the files were built (provenance)
  attestations: write

jobs:
  linux:
    # ubuntu-22.04 = glibc 2.35 floor, so the bundle runs on Debian 12+, Ubuntu 22.04+, Arch, Fedora 36+
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: system deps (Qt WebEngine runtime for the smoke test, deb tools)
        run: sudo apt-get update -q && sudo apt-get install -y -q dpkg-dev libgl1 libegl1 libxcb-cursor0 libxkbcommon-x11-0 libnss3 libasound2 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libportaudio2
      - name: install package + pyinstaller
        run: |
          python -m pip install --upgrade pip
          pip install ".[qt,voice]" pyinstaller
      - name: version
        id: v
        run: echo "version=$(python -c 'import datas;print(datas.__version__)')" >> "$GITHUB_OUTPUT"
      - name: the starter AI, shipped inside (checked against its SHA-256)
        run: python scripts/fetch_starter.py
      - name: pyinstaller
        run: pyinstaller --noconfirm installer/datas.spec
      - name: smoke test the frozen app
        run: |
          set -e
          dist/Datas/datas-cli --version
          dist/Datas/datas-cli selftest
          dist/Datas/datas-cli scan
          dist/Datas/datas-cli recommend --context 4096
          dist/Datas/datas-cli catalog list
          dist/Datas/datas-cli voice status
          dist/Datas/datas-cli images status > /dev/null
          dist/Datas/datas-cli apps list
          dist/Datas/datas-cli voice say "Datas can talk." --out /tmp/say.wav && test -s /tmp/say.wav
          dist/Datas/datas-cli things list
      - name: start with the computer (systemd user service), link code without a window, remove
        run: |
          set -e
          sudo loginctl enable-linger "$USER"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          for i in $(seq 1 30); do [ -S "$XDG_RUNTIME_DIR/bus" ] && break; sleep 1; done
          export DATAS_HOME="$RUNNER_TEMP/datas-service"
          dist/Datas/datas-cli service install
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8420/api/status > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8420/api/status | head -c 200; echo
          dist/Datas/datas-cli service status
          dist/Datas/datas-cli link code
          dist/Datas/datas-cli service remove
          sleep 2
          if curl -sf http://127.0.0.1:8420/api/status > /dev/null; then echo "still running after remove"; exit 1; fi
      - name: open the real window (Qt WebEngine) and let it check itself
        timeout-minutes: 8
        env:
          QT_QPA_PLATFORM: offscreen
          # the build machine does not allow the browser part its sandbox; users' systems do
          QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox
        run: |
          export DATAS_HOME="$RUNNER_TEMP/datas-window"
          dist/Datas/Datas open --selfcheck "$RUNNER_TEMP/window.json" || { cat "$RUNNER_TEMP/window.json"; tail -n 60 "$DATAS_HOME/logs/datas.log"; exit 1; }
          cat "$RUNNER_TEMP/window.json"
      - name: prune unused Qt libraries
        run: python installer/linux/prune-qt.py dist/Datas
      - name: deb
        run: installer/linux/build-deb.sh ${{ steps.v.outputs.version }}
      - name: tarball (generic + Arch source)
        run: |
          D=datas-${{ steps.v.outputs.version }}-linux-x64
          mkdir -p dist/tar/$D
          cp -a dist/Datas installer/linux/install.sh installer/linux/datas.desktop LICENSE dist/tar/$D/
          cp installer/windows/datas-256.png dist/tar/$D/datas.png
          tar -C dist/tar -czf dist/linux/$D.tar.gz $D
      - name: test the deb on Debian 12
        run: |
          docker run --rm -v "$PWD/dist/linux:/pkg:ro" debian:bookworm bash -ec '
            apt-get update -q >/dev/null && apt-get install -y -q /pkg/datas_${{ steps.v.outputs.version }}_amd64.deb >/dev/null
            datas-cli --version && datas-cli scan && test -f /usr/share/applications/datas.desktop
            # the installed window, with only the system libraries the package asks for
            QT_QPA_PLATFORM=offscreen datas open --selfcheck /tmp/window.json || { cat /tmp/window.json; exit 1; }
            grep -q "\"ok\": true" /tmp/window.json
            apt-get remove -y -q datas >/dev/null && test ! -e /opt/datas'
      - name: build + test the Arch package
        run: |
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/dist/linux:/out" archlinux:latest bash -ec '
            pacman -Syu --noconfirm --needed base-devel >/dev/null
            useradd -m build && mkdir -p /b && cp /src/installer/linux/arch/PKGBUILD /b/ && cd /b
            cp /out/datas-${{ steps.v.outputs.version }}-linux-x64.tar.gz /b/
            sed -i "s|^source=.*|source=(\"datas-${{ steps.v.outputs.version }}-linux-x64.tar.gz\")|" PKGBUILD
            chown -R build /b && su build -c "cd /b && makepkg -f -d --noconfirm" >/dev/null
            pacman -U --noconfirm /b/datas-bin-*.pkg.tar.zst >/dev/null
            datas-cli --version && datas-cli scan
            cp /b/datas-bin-*.pkg.tar.zst /out/'
      - uses: actions/upload-artifact@v4
        with:
          name: Datas-linux
          path: |
            dist/linux/*.deb
            dist/linux/*.pkg.tar.zst
            dist/linux/*.tar.gz
      - name: checksum files (SHA-256) next to the packages
        run: cd dist/linux && for f in *.deb *.pkg.tar.zst *.tar.gz; do sha256sum "$f" > "$f.sha256"; cat "$f.sha256"; done
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/linux/*.deb
            dist/linux/*.pkg.tar.zst
            dist/linux/*.tar.gz
            dist/linux/*.sha256
      - name: signed provenance — a public, verifiable record that these files were built here from this commit
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/linux/*.deb
            dist/linux/*.pkg.tar.zst
            dist/linux/*.tar.gz

  linux-arm64:
    # Raspberry Pi 4 and 5 (with a 64-bit system), NAS boxes, ARM home servers and laptops.
    # Built on Ubuntu 22.04 (glibc 2.35) so it runs on Raspberry Pi OS / Debian 12 and newer.
    # No window toolkit inside: on these machines Datas is used from the phone app, from
    # another computer, or in the browser of the same machine (docs/SMALL_COMPUTERS.md).
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: system deps (deb tools, sound library for voice)
        run: sudo apt-get update -q && sudo apt-get install -y -q dpkg-dev libportaudio2
      - name: install package + pyinstaller (with voice when its parts exist for ARM)
        run: |
          python -m pip install --upgrade pip
          pip install ".[voice]" pyinstaller || { echo "::warning::voice parts did not install on ARM; building without voice"; pip install . pyinstaller; }
      - name: version
        id: v
        run: echo "version=$(python -c 'import datas;print(datas.__version__)')" >> "$GITHUB_OUTPUT"
      - name: the starter AI, shipped inside (checked against its SHA-256)
        run: python scripts/fetch_starter.py
      - name: pyinstaller
        run: pyinstaller --noconfirm installer/datas.spec
      - name: smoke test the frozen app
        run: |
          set -e
          uname -m
          dist/Datas/datas-cli --version
          dist/Datas/datas-cli selftest
          dist/Datas/datas-cli scan
          dist/Datas/datas-cli recommend --context 4096
          dist/Datas/datas-cli catalog list
          dist/Datas/datas-cli voice status
          dist/Datas/datas-cli things list
      - name: the service answers without a window
        run: |
          set -e
          export DATAS_HOME="$RUNNER_TEMP/datas-plain"
          dist/Datas/datas-cli serve --no-browser --port 8431 > "$RUNNER_TEMP/serve.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8431/api/status > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8431/api/status | head -c 300; echo
          curl -sf http://127.0.0.1:8431/ | grep -q "/ui/app.js"
          curl -sf http://127.0.0.1:8431/api/things | head -c 400; echo
          curl -sf "http://127.0.0.1:8431/api/recommend" | head -c 300; echo
          kill %1
      - name: start with the computer (systemd user service), link code without a window, remove
        run: |
          set -e
          sudo loginctl enable-linger "$USER"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          for i in $(seq 1 30); do [ -S "$XDG_RUNTIME_DIR/bus" ] && break; sleep 1; done
          export DATAS_HOME="$RUNNER_TEMP/datas-service"
          dist/Datas/datas-cli service install
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8420/api/status > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8420/api/status | head -c 200; echo
          dist/Datas/datas-cli service status
          dist/Datas/datas-cli link code
          dist/Datas/datas-cli service remove
          sleep 2
          if curl -sf http://127.0.0.1:8420/api/status > /dev/null; then echo "still running after remove"; exit 1; fi
      - name: deb (arm64, no window toolkit)
        run: installer/linux/build-deb.sh ${{ steps.v.outputs.version }} arm64 plain
      - name: tarball
        run: |
          D=datas-${{ steps.v.outputs.version }}-linux-arm64
          mkdir -p dist/tar/$D
          cp -a dist/Datas installer/linux/install.sh installer/linux/datas.desktop LICENSE dist/tar/$D/
          cp installer/windows/datas-256.png dist/tar/$D/datas.png
          tar -C dist/tar -czf dist/linux/$D.tar.gz $D
      - name: test the deb on Debian 12 (the system of Raspberry Pi OS "Bookworm")
        run: |
          docker run --rm -v "$PWD/dist/linux:/pkg:ro" debian:bookworm bash -ec '
            apt-get update -q >/dev/null && apt-get install -y -q --no-install-recommends /pkg/datas_${{ steps.v.outputs.version }}_arm64.deb >/dev/null
            uname -m && datas-cli --version && datas-cli selftest && datas-cli scan && datas-cli things list
            apt-get remove -y -q datas >/dev/null && test ! -e /opt/datas'
      - uses: actions/upload-artifact@v4
        with:
          name: Datas-linux-arm64
          path: |
            dist/linux/*.deb
            dist/linux/*.tar.gz
      - name: checksum files (SHA-256) next to the packages
        run: cd dist/linux && for f in *.deb *.tar.gz; do sha256sum "$f" > "$f.sha256"; cat "$f.sha256"; done
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/linux/*.deb
            dist/linux/*.tar.gz
            dist/linux/*.sha256
      - name: signed provenance — a public, verifiable record that these files were built here from this commit
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/linux/*.deb
            dist/linux/*.tar.gz

  macos:
    runs-on: macos-latest   # Apple Silicon runner → arm64 build (Metal)
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install package + pyinstaller
        run: |
          python -m pip install --upgrade pip
          pip install ".[voice]" pyinstaller
      - name: version
        id: v
        run: echo "version=$(python -c 'import datas;print(datas.__version__)')" >> "$GITHUB_OUTPUT"
      - name: icon
        run: installer/macos/make-icns.sh
      # --- Apple signing: only when the owner added the certificate (docs/SIGNING.md) ---
      - name: put the Developer ID certificate in a keychain (only if it was provided)
        if: env.HAS_APPLE_CERT == 'true'
        env:
          P12: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/sign.keychain-db"; KP="$(uuidgen)"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          echo "$P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: the starter AI, shipped inside (checked against its SHA-256)
        run: python scripts/fetch_starter.py
      - name: pyinstaller
        env:
          DATAS_VERSION: ${{ steps.v.outputs.version }}
          DATAS_MACOS_IDENTITY: ${{ env.HAS_APPLE_CERT == 'true' && secrets.APPLE_SIGN_IDENTITY || '' }}
        run: pyinstaller --noconfirm installer/datas.spec
      - name: smoke test the frozen app
        run: |
          set -e
          dist/Datas.app/Contents/MacOS/datas-cli --version
          dist/Datas.app/Contents/MacOS/datas-cli selftest
          dist/Datas.app/Contents/MacOS/datas-cli scan
          dist/Datas.app/Contents/MacOS/datas-cli recommend --context 4096
          dist/Datas.app/Contents/MacOS/datas-cli catalog list
          dist/Datas.app/Contents/MacOS/datas-cli voice status
          dist/Datas.app/Contents/MacOS/datas-cli apps list
          dist/Datas.app/Contents/MacOS/datas-cli voice say "Datas can talk." --out /tmp/say.wav && test -s /tmp/say.wav
      - name: open the real window (WKWebView) and let it check itself
        timeout-minutes: 8
        run: |
          export DATAS_HOME="$RUNNER_TEMP/datas-window"
          dist/Datas.app/Contents/MacOS/Datas open --selfcheck "$RUNNER_TEMP/window.json" || { cat "$RUNNER_TEMP/window.json"; tail -n 60 "$DATAS_HOME/logs/datas.log"; exit 1; }
          cat "$RUNNER_TEMP/window.json"
      - name: start at login (LaunchAgent), status, link code without a window, remove
        timeout-minutes: 5
        run: |
          set -e
          export DATAS_HOME="$RUNNER_TEMP/datas-service"
          dist/Datas.app/Contents/MacOS/datas-cli service install
          plutil -p ~/Library/LaunchAgents/ar.datas.service.plist
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8420/api/status > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8420/api/status | head -c 200; echo
          dist/Datas.app/Contents/MacOS/datas-cli service status
          dist/Datas.app/Contents/MacOS/datas-cli link code
          dist/Datas.app/Contents/MacOS/datas-cli service remove
          sleep 3
          test ! -e ~/Library/LaunchAgents/ar.datas.service.plist
          if curl -sf http://127.0.0.1:8420/api/status > /dev/null; then echo "still running after remove"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-check-macos
          path: |
            ${{ runner.temp }}/window.json
            ${{ runner.temp }}/window.png
          if-no-files-found: ignore
      - name: dmg
        run: installer/macos/build-dmg.sh ${{ steps.v.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: Datas-macos
          path: dist/macos/*.dmg
      - name: sign and notarize the disk image (only if the certificate was provided)
        if: env.HAS_APPLE_CERT == 'true'
        env:
          IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          DMG="$(ls dist/macos/*.dmg)"
          codesign --force --timestamp --sign "$IDENTITY" "$DMG"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$DMG"
      - name: checksum file (SHA-256) next to the disk image
        run: cd dist/macos && for f in *.dmg; do shasum -a 256 "$f" > "$f.sha256"; cat "$f.sha256"; done
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/macos/*.dmg
            dist/macos/*.sha256
      - name: signed provenance — a public, verifiable record that this file was built here from this commit
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/macos/*.dmg
