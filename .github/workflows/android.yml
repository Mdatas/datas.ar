name: android-apk

on:
  push:
    branches: [main]
    paths: ["android/**", "datas/catalog/models.json", "scripts/android-fetch-llamacpp.sh", ".github/workflows/android.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write       # attach the installer to a release when run on a v* tag
  id-token: write       # sign a statement of where the file was built (provenance)
  attestations: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: android sdk (preinstalled on ubuntu runners; make sure API 35 is there)
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK=$SDK"
          MGR="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          yes | "$MGR" --licenses >/dev/null 2>&1 || true
          "$MGR" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null
          echo "sdk.dir=$SDK" > android/local.properties
      - name: fetch llama.cpp android build (stripped) into jniLibs
        run: scripts/android-fetch-llamacpp.sh
      - name: sync catalog into assets
        run: cp datas/catalog/models.json android/app/src/main/assets/models.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the starter AI, shipped inside (checked against its SHA-256)
        run: |
          pip install -e . >/dev/null
          python scripts/fetch_starter.py android/app/src/main/assets/starter
      - name: decode release keystore (optional)
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/release.keystore
      - name: build
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ env.HAS_KEYSTORE == 'true' && '../release.keystore' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease
          ls -la app/build/outputs/apk/*/
      - name: rename
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Datas-debug.apk
          cp android/app/build/outputs/apk/release/app-release*.apk Datas-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Datas-apk
          path: |
            Datas-debug.apk
            Datas-release.apk
      - name: checksum files (SHA-256)
        run: for f in Datas-debug.apk Datas-release.apk; do sha256sum "$f" > "$f.sha256"; cat "$f.sha256"; done
      - name: name it for the release page (Datas-<version>-android.apk)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          N="Datas-${GITHUB_REF_NAME#v}-android.apk"
          cp Datas-release.apk "$N"
          sha256sum "$N" > "$N.sha256"; cat "$N.sha256"
          echo "APK=$N" >> "$GITHUB_ENV"
      - name: attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.APK }}
            ${{ env.APK }}.sha256
      - name: signed provenance — a public, verifiable record that this file was built here from this commit
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.APK }}
