name: android-apk

on:
  push:
    branches: [main]
    paths: ["android/**", "datas/catalog/models.json", "scripts/android-fetch-llamacpp.sh", ".github/workflows/android.yml"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: fetch llama.cpp android build (stripped) into jniLibs
        run: scripts/android-fetch-llamacpp.sh
      - name: sync catalog into assets
        run: cp datas/catalog/models.json android/app/src/main/assets/models.json
      - name: decode release keystore (optional)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/release.keystore
      - name: build
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_BASE64 != '' && '../release.keystore' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease
          ls -la app/build/outputs/apk/*/
      - name: rename
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Datas-debug.apk
          cp android/app/build/outputs/apk/release/app-release*.apk Datas-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Datas-apk
          path: |
            Datas-debug.apk
            Datas-release.apk
      - name: attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Datas-debug.apk
            Datas-release.apk
