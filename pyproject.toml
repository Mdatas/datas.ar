[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "datas-ar"
version = "0.2.0"
description = "Datas.ar — download, hit run, get the best open AI your device can carry. Local-first, open source, pools your devices."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [{ name = "Mdatas" }]
keywords = ["local-ai", "llm", "llama.cpp", "gguf", "offline", "distributed-inference", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "psutil>=6.0",
  "py-cpuinfo>=9.0",
  "huggingface_hub>=0.30",
  "gguf>=0.17",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.0",
  "pydantic>=2.7",
  "zeroconf>=0.132",
  "platformdirs>=4.0",
  "pywebview>=5.0",
]

[project.optional-dependencies]
nvidia = ["nvidia-ml-py>=12.0"]
qt = ["qtpy>=2.4", "PyQt6>=6.6", "PyQt6-WebEngine>=6.6"]  # Linux window toolkit (self-contained)
voice = ["pywhispercpp>=1.5", "kokoro-onnx>=0.6", "sounddevice>=0.5"]  # hearing (whisper.cpp), speaking (Kokoro), microphone
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
datas = "datas.__main__:main"

[project.urls]
Homepage = "https://datas.ar"
Repository = "https://github.com/mdatas/datas.ar"
Issues = "https://github.com/mdatas/datas.ar/issues"

[tool.hatch.build.targets.wheel]
packages = ["datas"]

[tool.hatch.build.targets.wheel.force-include]
"datas/catalog/models.json" = "datas/catalog/models.json"
"datas/catalog/media.json" = "datas/catalog/media.json"
"datas/sources.json" = "datas/sources.json"
"datas/server/ui/index.html" = "datas/server/ui/index.html"
"datas/server/ui/agent.html" = "datas/server/ui/agent.html"
"datas/server/ui/datas.ico" = "datas/server/ui/datas.ico"
"datas/server/ui/datas.png" = "datas/server/ui/datas.png"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]  # B008: typer.Option defaults are idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]
